<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Rates — CYRO Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#E59303;--gold-light:rgba(229,147,3,0.08);--gold-mid:rgba(229,147,3,0.15);
  --bg:#0b0b1a;--text:#e8e8f0;--text-muted:#a0a0b8;--text-light:#6a6a80;
  --border:#2a2a40;--card-bg:#111128;--radius:8px;
  --font:-apple-system,'Inter','Segoe UI',sans-serif;
  --side-w:220px;
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;line-height:1.5}
.sidebar{
  width:var(--side-w);background:var(--card-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;
}
.sidebar .logo{
  padding:20px 20px 16px;border-bottom:1px solid var(--border);
  font-size:18px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;
}
.sidebar .logo .g{color:var(--gold)}
.sidebar .logo .sub{font-size:9px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:1.5px;margin-left:4px}
.sidebar nav{padding:12px 0;flex:1}
.sidebar nav a{
  display:flex;align-items:center;gap:10px;padding:10px 20px;text-decoration:none;
  color:var(--text-muted);font-size:14px;transition:all 0.15s;border-left:3px solid transparent;
}
.sidebar nav a:hover{color:var(--text);background:var(--gold-light)}
.sidebar nav a.active{color:var(--gold);background:var(--gold-light);border-left-color:var(--gold);font-weight:600}
.sidebar nav a .ico{width:18px;text-align:center;font-size:15px}
.sidebar .back-link{padding:16px 20px;border-top:1px solid var(--border);font-size:12px}
.sidebar .back-link a{color:var(--text-muted);text-decoration:none}
.sidebar .back-link a:hover{color:var(--gold)}
.main{margin-left:var(--side-w);flex:1;padding:32px;max-width:1200px}
.header{margin-bottom:28px}
.header h1{font-size:22px;font-weight:700}
.header h1 span{color:var(--gold)}
.header .sub{font-size:13px;color:var(--text-muted);margin-top:4px}
/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:24px}
.card{
  background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px;
  transition:border 0.15s;
}
.card:hover{border-color:var(--gold-mid)}
.card .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card .card-header h3{font-size:16px;font-weight:700}
.card .card-header h3 .g{color:var(--gold)}
.card .rate-label{font-size:12px;color:var(--text-light);margin-bottom:4px}
.card .rate-value{font-size:28px;font-weight:700;color:var(--text);margin-bottom:4px}
.card .rate-sub{font-size:12px;color:var(--text-muted)}
.card .card-body{padding-top:14px;border-top:1px solid var(--border)}
.card .card-body label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;margin-top:10px}
.card .card-body label:first-child{margin-top:0}
.card .card-body input,.card .card-body select{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 10px;color:var(--text);font-size:13px;outline:none;
}
.card .card-body input:focus{border-color:var(--gold)}
.card .card-body .btn-row{display:flex;gap:6px;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);
  font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all 0.15s;
}
.btn-primary{background:var(--gold);color:#000;border-color:var(--gold)}
.btn-primary:hover{opacity:0.88}
.btn-outline{background:transparent;color:var(--text-muted);border-color:var(--border)}
.btn-outline:hover{color:var(--text);border-color:var(--gold)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-success{background:#16a34a;color:#fff}
.btn-success:hover{opacity:0.85}
/* Section titles */
.section-title{font-size:14px;font-weight:600;color:var(--text-muted);margin-bottom:12px;margin-top:32px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.section-title:first-child{margin-top:0}
/* Min deposits table */
.list-table{width:100%;border-collapse:collapse;font-size:13px}
.list-table th{padding:10px 14px;text-align:left;font-weight:600;color:var(--text-muted);font-size:12px;border-bottom:1px solid var(--border);background:rgba(229,147,3,0.04)}
.list-table td{padding:10px 14px;border-bottom:1px solid rgba(42,42,64,0.5)}
.list-table td input{width:120px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;color:var(--text);font-size:13px;outline:none}
.list-table td input:focus{border-color:var(--gold)}
/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;background:#16a34a;color:#fff;padding:12px 20px;
  border-radius:var(--radius);font-size:13px;font-weight:600;z-index:2000;
  opacity:0;transform:translateY(12px);transition:all 0.3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#dc2626}
/* Responsive */
@media(max-width:768px){
  .sidebar{width:56px}
  .sidebar .logo span,.sidebar nav a span{display:none}
  .sidebar nav a{padding:10px 18px;justify-content:center}
  .sidebar nav a .ico{font-size:18px}
  .sidebar .logo{padding:16px;justify-content:center}
  .sidebar .logo .sub{display:none}
  .sidebar .back-link{display:none}
  .main{margin-left:56px;padding:20px 14px}
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo"><span class="g">CY</span>RO<span class="sub">Admin</span></div>
  <nav>
    <a href="admin.html"><span class="ico">◉</span><span>Dashboard</span></a>
    <a href="admin-users.html"><span class="ico">◎</span><span>Users</span></a>
    <a href="admin-transactions.html"><span class="ico">↔</span><span>Transactions</span></a>
    <a href="admin-rates.html" class="active"><span class="ico">%</span><span>Token Rates</span></a>
    <a href="admin-chains.html"><span class="ico">⛓</span><span>Networks</span></a>
  </nav>
  <div class="back-link"><a href="index.html">← Back to site</a></div>
</div>

<!-- Main -->
<div class="main">
  <div class="header">
    <h1><span>Token Rate</span> Settings</h1>
    <div class="sub">Configure exchange rates and minimum deposit amounts. Changes apply immediately across the platform.</div>
  </div>

  <!-- Exchange Rate Cards -->
  <div class="section-title">Exchange Rates (1 token = X CYRO)</div>
  <div class="card-grid" id="rateCards"></div>

  <!-- Minimum Deposits -->
  <div class="section-title">Minimum Deposit Amounts</div>
  <div class="card" style="padding:16px">
    <table class="list-table">
      <thead>
        <tr><th>Token</th><th>Min Deposit</th><th>Action</th></tr>
      </thead>
      <tbody id="minDepositTable"></tbody>
    </table>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// =============================================
// Data
// =============================================
function getRates() {
  return JSON.parse(localStorage.getItem('cyro_rates') || '{"USDT":10,"USDC":9.5,"CYRO":1}');
}
function saveRates(rates) {
  localStorage.setItem('cyro_rates', JSON.stringify(rates));
}
function getMinDeposits() {
  return JSON.parse(localStorage.getItem('cyro_min_deposits') || '{"USDT":10,"USDC":10,"CYRO":50}');
}
function saveMinDeposits(mins) {
  localStorage.setItem('cyro_min_deposits', JSON.stringify(mins));
}

// =============================================
// Render
// =============================================
function renderRates() {
  const rates = getRates();
  const container = document.getElementById('rateCards');
  container.innerHTML = Object.entries(rates).map(([token, rate]) => {
    const colorMap = { USDT: '#26a17b', USDC: '#2775ca', CYRO: 'var(--gold)' };
    return `<div class="card">
      <div class="card-header">
        <h3 style="color:${colorMap[token] || '#fff'}">${token}</h3>
        <button class="btn btn-sm btn-outline" onclick="editRate('${token}')">Edit</button>
      </div>
      <div class="rate-label">1 ${token} =</div>
      <div class="rate-value">${rate} <span style="font-size:14px;color:var(--text-muted)">CYRO</span></div>
      <div class="rate-sub">1 CYRO = ${(1/rate).toFixed(6)} ${token}</div>
      <div class="card-body" id="editForm-${token}" style="display:none">
        <label>${token} → CYRO rate</label>
        <input type="number" id="rateInput-${token}" value="${rate}" min="0.01" step="0.1">
        <div class="btn-row">
          <button class="btn btn-sm btn-success" onclick="saveRate('${token}')">Save</button>
          <button class="btn btn-sm btn-outline" onclick="cancelEdit('${token}')">Cancel</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderMinDeposits() {
  const mins = getMinDeposits();
  const tbody = document.getElementById('minDepositTable');
  tbody.innerHTML = Object.entries(mins).map(([token, min]) => `
    <tr>
      <td style="font-weight:600">${token}</td>
      <td><input type="number" id="minInput-${token}" value="${min}" min="0" step="1"></td>
      <td><button class="btn btn-sm btn-primary" onclick="saveMin('${token}')">Save</button></td>
    </tr>
  `).join('');
}

// =============================================
// Actions
// =============================================
function editRate(token) {
  document.getElementById(`editForm-${token}`).style.display = 'block';
}
function cancelEdit(token) {
  const rates = getRates();
  document.getElementById(`rateInput-${token}`).value = rates[token];
  document.getElementById(`editForm-${token}`).style.display = 'none';
}
function saveRate(token) {
  const val = parseFloat(document.getElementById(`rateInput-${token}`).value);
  if (isNaN(val) || val <= 0) { showToast('Rate must be greater than 0', true); return; }
  const rates = getRates();
  rates[token] = val;
  saveRates(rates);
  document.getElementById(`editForm-${token}`).style.display = 'none';
  renderRates();
  showToast(`${token} rate updated to 1 ${token} = ${val} CYRO`);
}

function saveMin(token) {
  const val = parseFloat(document.getElementById(`minInput-${token}`).value);
  if (isNaN(val) || val < 0) { showToast('Invalid minimum amount', true); return; }
  const mins = getMinDeposits();
  mins[token] = val;
  saveMinDeposits(mins);
  renderMinDeposits();
  showToast(`${token} min deposit updated to ${val}`);
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

// =============================================
// Init
// =============================================
renderRates();
renderMinDeposits();
</script>
</body>
</html>
